<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mérida for Sale · Visor de Realidad Aumentada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    :root {
      --bg: #F4EFE6;
      --surface: #FFFFFF;
      --text: #1E1B18;
      --soft: #3B3631;
      --muted: #5C554D;
      --border: #E0D8CB;
      --merida: #1F5F5B;
      --foreign: #D4882A;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif; line-height: 1.5;
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 20px 18px 48px; }
    .topbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 18px;
    }
    .brand { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none; }
    .back { font-size: 13.5px; font-weight: 600; color: var(--merida); text-decoration: none; }
    .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
    h1 { font-family: 'Space Grotesk', sans-serif; font-size: clamp(26px, 5vw, 38px); letter-spacing: -0.02em; margin: 4px 0 8px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 18px; }
    .tab {
      border: 1.5px solid var(--merida); background: var(--surface); color: var(--merida);
      font-family: 'IBM Plex Sans', sans-serif; font-size: 13.5px; font-weight: 600;
      padding: 8px 14px; border-radius: 999px; cursor: pointer;
    }
    .tab.active { background: var(--merida); color: #FFFFFF; }
    .viewer-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden; box-shadow: 0 4px 20px rgba(30,27,24,0.06);
    }
    .viewer-head { padding: 18px 20px 12px; border-bottom: 1px solid var(--border); }
    .viewer-head h2 { font-family: 'Space Grotesk', sans-serif; font-size: 21px; margin: 0 0 4px; }
    .viewer-head p { margin: 0; font-size: 14px; color: var(--soft); }
    model-viewer {
      width: 100%; height: 500px;
      background: radial-gradient(circle at 50% 30%, #FBF8F3 0%, #EAE2D3 100%);
    }
    .legend {
      padding: 12px 20px 16px; border-top: 1px solid var(--border);
      display: flex; flex-wrap: wrap; gap: 10px 16px; font-size: 13px; color: var(--soft);
    }
    .swatch { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
    .hotspot {
      background: rgba(30, 27, 24, 0.90); color: #F4EFE6;
      border: 1px solid rgba(255,255,255,0.22); border-radius: 6px;
      padding: 4px 8px; font-size: 11.5px; font-weight: 500; white-space: nowrap;
      pointer-events: none;
    }
    .hotspot b { color: #E8C27A; }
    .ar-btn {
      position: absolute; bottom: 14px; right: 14px;
      background: var(--merida); color: #fff; border: none;
      border-radius: 999px; padding: 10px 18px; font-size: 13.5px; font-weight: 600;
      cursor: pointer; font-family: 'IBM Plex Sans', sans-serif;
      box-shadow: 0 4px 12px rgba(31, 95, 91, 0.35);
    }
    .note { font-size: 12.5px; color: var(--muted); margin-top: 14px; }
    @media (max-width: 600px) { model-viewer { height: 390px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a class="brand" href="../index.html">Mérida en venta</a>
      <a class="back" href="../index.html">← Volver al booklet</a>
    </header>

    <span class="eyebrow">Realidad Aumentada · Equipo 9 (UPY Data 9B)</span>
    <h1>Explora los datos en 3D y AR</h1>

    <div class="tabs" role="tablist">
      <button class="tab active" data-scene="1">1 · Manzana del Centro</button>
      <button class="tab" data-scene="2">2 · Turistas 2015–2026*</button>
      <button class="tab" data-scene="3">3 · Aeropuertos (MID · OAX · CUN)</button>
    </div>

    <div class="viewer-card">
      <div class="viewer-head">
        <h2 id="scene-title"></h2>
        <p id="scene-desc"></p>
      </div>
      <model-viewer id="mv" camera-controls auto-rotate auto-rotate-delay="2200"
        rotation-per-second="10deg" shadow-intensity="0.88" exposure="1.05"
        ar ar-modes="webxr scene-viewer quick-look">
        <button slot="ar-button" class="ar-btn">Ver en tu espacio (AR)</button>
      </model-viewer>
      <div id="scene-legend" class="legend"></div>
    </div>

    <p class="note">
      Arrastra para rotar, pellizca para acercar. En teléfono móvil (iOS o Android), pulsa <strong>Ver en tu espacio (AR)</strong> para proyectar la maqueta sobre una mesa sin instalar aplicaciones.
    </p>
  </div>

  <script>
    const SCENES = {
      "1": {
        title: "Escena AR 1 · Manzana 0440-009 (Santa Lucía), 2019 vs. 2025",
        desc: "Diorama colonial de una manzana real del Centro Histórico con sus 33 negocios (INEGI DENUE): 15 sobrevivieron, 7 abrieron después de 2019 y 11 cerraron. Los 6 hoteles boutique destacan con terraza y alberca.",
        src: "models/escena_1_centro_manzana.glb",
        orbit: "38deg 52deg 1.45m",
        hotspots: [
          { pos: "0.0 0.20 -0.31", html: "Abrieron después de 2019 · <b>7 negocios</b>" },
          { pos: "0.31 0.16 0.0", html: "Existían en 2019 · <b>15 negocios</b>" },
          { pos: "-0.31 0.08 0.0", html: "Cerraron · <b>11 negocios</b>" }
        ],
        legend: [
          ["#1F5F5B", "Existía en 2019 (15)"],
          ["#D4882A", "Abrió después de 2019 (7)"],
          ["#9E958B", "Cerró después de 2019 (11)"],
          ["#4A90A4", "Terraza + alberca = Hospedaje (6)"]
        ]
      },
      "2": {
        title: "Escena AR 2 · Turistas de hotel en Mérida (2015–2026*)",
        desc: "Barras 3D apiladas de llegadas anuales (DataTur). El plano translúcido marca el nivel de 2019 (1.74M); en 2025 Mérida alcanzó 2.26M (+30%). 2026* incluye enero a septiembre.",
        src: "models/escena_2_turistas_barras3d.glb",
        orbit: "22deg 64deg 1.65m",
        hotspots: [
          { pos: "-0.14 0.48 0.0", html: "2019 · <b>1.74M</b>" },
          { pos: "-0.05 0.21 0.0", html: "2020 · <b>0.67M (COVID)</b>" },
          { pos: "0.41 0.61 0.0", html: "2025 · <b>2.26M (+30%)</b>" }
        ],
        legend: [
          ["#1F5F5B", "Turistas nacionales (~80%)"],
          ["#D4882A", "Turistas extranjeros (~20%)"],
          ["#8BB3AE", "2026* parcial (ene–sep)"],
          ["rgba(37,33,30,0.25)", "Plano = nivel 2019 (1.74M)"]
        ]
      },
      "3": {
        title: "Escena AR 3 · Crecimiento aeroportuario: Mérida vs. Oaxaca vs. Cancún",
        desc: "Cordilleras 3D de 2015 a 2025 en índice 2019 = 100 (ASUR). Mérida (+41%) y Oaxaca (+56%) crecieron proporcionalmente más que Cancún (+15%), aunque Cancún concentra 66% de tráfico internacional.",
        src: "models/escena_3_aeropuertos_cordilleras.glb",
        orbit: "32deg 58deg 1.60m",
        hotspots: [
          { pos: "0.48 0.43 -0.17", html: "Mérida · <b>141.2</b> (+41%)" },
          { pos: "0.48 0.47 0.0", html: "Oaxaca · <b>155.9</b> (+56%)" },
          { pos: "0.48 0.36 0.17", html: "Cancún · <b>115.2</b> (+15%)" }
        ],
        legend: [
          ["#1F5F5B", "Mérida (MID · 10% intl.)"],
          ["#D96B43", "Oaxaca (OAX · 15% intl.)"],
          ["#2E6F9E", "Cancún (CUN · 66% intl.)"],
          ["rgba(37,33,30,0.25)", "Plano = 2019 (índice 100)"]
        ]
      }
    };

    const mv = document.getElementById("mv");
    const titleEl = document.getElementById("scene-title");
    const descEl = document.getElementById("scene-desc");
    const legendEl = document.getElementById("scene-legend");
    const tabs = document.querySelectorAll(".tab");

    function loadScene(id) {
      const s = SCENES[id] || SCENES["1"];
      tabs.forEach(t => t.classList.toggle("active", t.dataset.scene === id));
      titleEl.textContent = s.title;
      descEl.textContent = s.desc;
      mv.setAttribute("src", s.src);
      mv.setAttribute("camera-orbit", s.orbit);
      mv.querySelectorAll(".hotspot").forEach(el => el.remove());
      s.hotspots.forEach((h, i) => {
        const div = document.createElement("div");
        div.className = "hotspot";
        div.setAttribute("slot", `hotspot-${i + 1}`);
        div.setAttribute("data-position", h.pos);
        div.setAttribute("data-normal", "0 1 0");
        div.innerHTML = h.html;
        mv.appendChild(div);
      });
      legendEl.innerHTML = s.legend
        .map(([col, lbl]) => `<span class="swatch"><i class="dot" style="background:${col}"></i>${lbl}</span>`)
        .join("");
    }

    tabs.forEach(t => t.addEventListener("click", () => loadScene(t.dataset.scene)));
    const initial = new URLSearchParams(location.search).get("escena") || "1";
    loadScene(SCENES[initial] ? initial : "1");
  </script>
</body>
</html>
